name: amrtools_surveyor
description: خدمات المساح والمقاول – التطبيق الرسمي لأم تولز
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.15.2
  firebase_database: ^11.3.10
  firebase_auth: ^5.6.2
  firebase_app_check: ^0.3.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1

  # UI & State
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  shimmer: ^3.0.0

  # Images
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Connectivity
  connectivity_plus: ^6.0.5

  # Native launching
  url_launcher: ^6.2.5
  share_plus: ^9.0.0

  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Ads
  google_mobile_ads: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
